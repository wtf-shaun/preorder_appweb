{% extends 'base.html' %}
{% block content %}

<h1>Login</h1>

<form method="post">

    <label for="email">Email</label>
    <input id="email" name="email" required type="email" placeholder="you@example.com">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required placeholder="••••••••">

    <button type="submit">Login</button>

</form>

<p>
    Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
</p>

<div class="demo-login-wrapper">

    <div class="demo-divider"><span>or</span></div>

    <p class="demo-login-text">Just want to look around?</p>

    <a href="{{ url_for('main.demo_login') }}" class="btn demo-btn">
        🧪 Test the App (Guest Mode)
    </a>

</div>

{% endblock %}
