<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f3ef">
    <title>Cafeteria Pre-Order</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #1f2d3d;
            --ink-soft: #2f394b;
            --muted: #7a736d;
            --orange: #f27a2b;
            --orange-soft: rgba(242, 122, 43, 0.12);
            --green: #2f7d5a;
            --paper: #f4f1eb;
            --paper-deep: #eee7df;
            --line: rgba(31, 45, 61, 0.12);
        }

        * { box-sizing: border-box; }

        html, body { min-width: 320px; min-height: 100%; margin: 0; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            overflow: hidden;
            border-top: 5px solid var(--orange);
            background:
                repeating-linear-gradient(135deg, rgba(40, 44, 63, 0.018) 0 1px, transparent 1px 18px),
                radial-gradient(circle at 20% 15%, rgba(242, 122, 43, 0.05), transparent 24%),
                radial-gradient(circle at 80% 80%, rgba(47, 125, 90, 0.04), transparent 22%),
                var(--paper);
            color: var(--ink);
            font-family: "Segoe UI", "Trebuchet MS", sans-serif;
        }

        main {
            position: relative;
            width: min(100% - 36px, 430px);
            padding: 30px 26px 28px;
            text-align: center;
            animation: rise-in 420ms ease-out both;
        }

        main::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.03));
            pointer-events: none;
        }

        .brand-mark {
            position: relative;
            z-index: 1;
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(242, 122, 43, 0.5);
            border-radius: 16px 16px 5px 16px;
            background: rgba(255, 255, 255, 0.86);
            color: var(--orange);
            font-family: Georgia, serif;
            font-size: 21px;
            font-weight: 700;
            box-shadow: 0 8px 22px rgba(40, 44, 63, 0.08);
        }

        h1 {
            position: relative;
            z-index: 1;
            margin: 0;
            color: var(--ink-soft);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(28px, 3vw, 34px);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        p {
            position: relative;
            z-index: 1;
            min-height: 28px;
            margin: 12px 0 24px;
            color: var(--muted);
            font-size: 15px;
            font-style: italic;
            letter-spacing: 0.01em;
        }

        .progress {
            position: relative;
            z-index: 1;
            width: 180px;
            height: 5px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(40, 44, 63, 0.12);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .progress span {
            display: block;
            width: 36%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--orange), #f0ad2f, var(--green));
            box-shadow: 0 0 12px rgba(242, 122, 43, 0.25);
            animation: loading 1.5s ease-in-out infinite;
        }

        .retry {
            position: relative;
            z-index: 1;
            margin-top: 26px;
            padding: 8px 14px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--green);
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .retry:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        @keyframes loading {
            0% { transform: translateX(-115%); }
            100% { transform: translateX(315%); }
        }

        @keyframes rise-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <main aria-live="polite">
        <div class="brand-mark" aria-hidden="true">CP</div>
        <h1>Cafeteria Pre-Order</h1>
        <p id="status">Getting the menu ready…</p>
        <div class="progress" role="progressbar" aria-label="Starting the app">
            <span></span>
        </div>
        <button class="retry" type="button" onclick="window.location.reload()">Try again</button>
    </main>
    <script>
        const statusText = document.getElementById('status');
        let delay = 800;
        let attempts = 0;

        async function waitForApp() {
            while (true) {
                attempts += 1;
                try {
                    const response = await fetch('/healthz', { cache: 'no-store' });
                    if (response.ok) {
                        window.location.replace('/menu');
                        return;
                    }
                } catch (error) {
                    // The function is still starting or is temporarily unreachable.
                }

                if (attempts === 5) {
                    statusText.textContent = 'This is taking a little longer than usual.';
                }
                await new Promise(resolve => setTimeout(resolve, delay));
                delay = Math.min(Math.round(delay * 1.5), 3000);
            }
        }

        waitForApp();
    </script>
</body>
</html>
