<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Cafeteria Pre-Order</title>
    <style>
        :root {
            color-scheme: light;
            --paper: #f6f3ed;
            --ink: #17243a;
            --muted: #706c68;
            --orange: #cf7138;
            --orange-light: #e5a06f;
            --line: rgba(35, 41, 53, 0.1);
        }

        * { box-sizing: border-box; }

        html, body {
            min-width: 320px;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            grid-template-rows: 66px 1fr;
            overflow: hidden;
            border-top: 4px solid var(--orange);
            background:
                linear-gradient(166deg, transparent 0 18%, rgba(235, 194, 158, 0.13) 18.2% 35%, transparent 35.2%),
                linear-gradient(166deg, transparent 0 44%, rgba(255, 255, 255, 0.4) 44.2% 61%, transparent 61.2%),
                linear-gradient(166deg, transparent 0 72%, rgba(204, 216, 204, 0.11) 72.2% 90%, transparent 90.2%),
                radial-gradient(ellipse at 16% 32%, rgba(244, 201, 165, 0.2), transparent 36%),
                var(--paper);
            color: var(--ink);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .site-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 clamp(20px, 3vw, 36px);
            background: rgba(255, 255, 255, 0.94);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 5px 18px rgba(36, 40, 48, 0.06);
        }

        .site-header img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .site-header span {
            color: #bc7540;
            font-size: 20px;
            font-weight: 750;
            letter-spacing: 0.01em;
        }

        main {
            width: min(100% - 36px, 800px);
            align-self: center;
            justify-self: center;
            padding: 0 18px 28px;
            text-align: center;
            animation: rise-in 420ms ease-out both;
        }

        h1 {
            margin: 0;
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(36px, 5vw, 54px);
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.025em;
        }

        p {
            min-height: 28px;
            margin: 12px 0 25px;
            color: var(--muted);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 14px;
            font-style: italic;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 220ms ease, transform 220ms ease;
        }

        p.is-changing {
            opacity: 0;
            transform: translateY(4px);
        }

        .progress {
            position: relative;
            width: min(295px, 76vw);
            height: 7px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(207, 113, 56, 0.24);
            box-shadow: inset 0 1px 2px rgba(56, 43, 35, 0.08);
        }

        .progress span {
            position: relative;
            display: block;
            width: 34%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--orange), #eea36f, var(--orange));
            box-shadow: 0 0 9px rgba(207, 113, 56, 0.32);
            animation: loading-sweep 1.65s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        }

        .progress span::after {
            position: absolute;
            top: 0;
            right: 0;
            width: 18px;
            height: 100%;
            border-radius: inherit;
            background: rgba(255, 255, 255, 0.58);
            content: "";
            filter: blur(3px);
        }

        .retry {
            margin-top: 20px;
            border: 0;
            background: transparent;
            color: #39775c;
            font: inherit;
            font-size: 14px;
            font-weight: 650;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }

        .retry[hidden] {
            display: none;
        }

        .retry:hover {
            color: #285d47;
        }

        @keyframes loading-sweep {
            0% { transform: translateX(-110%); }
            100% { transform: translateX(405%); }
        }

        @keyframes rise-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 520px) {
            body {
                grid-template-rows: 60px 1fr;
            }

            .site-header span {
                font-size: 17px;
            }

            main {
                padding-bottom: 18px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <img src="/static/logo.png" alt="">
        <span>Pre-order System</span>
    </header>
    <main>
        <h1>Cafeteria Pre-Order</h1>
        <p id="status" aria-live="polite" aria-atomic="true">Getting the menu ready…</p>
        <div class="progress" role="progressbar" aria-label="Starting the app" aria-valuetext="Loading">
            <span></span>
        </div>
        <button class="retry" type="button" onclick="window.location.reload()" hidden>Try again</button>
    </main>
    <script>
        const statusText = document.getElementById('status');
        const loadingPhrases = [
            'Getting the menu ready…',
            'A fresh café moment is just around the corner…',
            'Preparing something delicious for your break…',
            'Made fresh, ready when you are…',
            'Setting the table for a better break…'
        ];
        let phraseIndex = 0;
        let delay = 800;
        let attempts = 0;

        setInterval(() => {
            statusText.classList.add('is-changing');
            setTimeout(() => {
                phraseIndex = (phraseIndex + 1) % loadingPhrases.length;
                statusText.textContent = loadingPhrases[phraseIndex];
                statusText.classList.remove('is-changing');
            }, 220);
        }, 2800);

        async function waitForApp() {
            while (true) {
                attempts += 1;
                try {
                    const response = await fetch('/healthz', { cache: 'no-store' });
                    if (response.ok) {
                        window.location.replace('/menu');
                        return;
                    }
                } catch (error) {
                    // The function is still starting or is temporarily unreachable.
                }

                if (attempts === 5) {
                    loadingPhrases.push('Still getting everything ready — thank you for your patience.');
                    document.querySelector('.retry').hidden = false;
                }
                await new Promise(resolve => setTimeout(resolve, delay));
                delay = Math.min(Math.round(delay * 1.5), 3000);
            }
        }

        waitForApp();
    </script>
</body>
</html>
