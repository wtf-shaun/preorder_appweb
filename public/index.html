<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f3ef">
    <title>Cafeteria Pre-Order</title>
    <style>
        :root {
            color-scheme: light;
            --paper: #f3f0ea;
            --paper-deep: #e7e0d7;
            --ink: #273347;
            --ink-soft: #4a5365;
            --muted: #7f7871;
            --orange: #f27a2b;
            --orange-deep: #ea6e0f;
            --green: #3b7d5f;
            --line: rgba(39, 51, 71, 0.12);
            --shadow: rgba(31, 40, 52, 0.09);
        }

        * { box-sizing: border-box; }

        html, body {
            min-width: 320px;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            overflow: hidden;
            border-top: 5px solid var(--orange);
            background:
                repeating-linear-gradient(
                    135deg,
                    rgba(39, 51, 71, 0.016) 0 1px,
                    transparent 1px 18px
                ),
                var(--paper);
            color: var(--ink);
            font-family: "Segoe UI", "Trebuchet MS", sans-serif;
        }

        main {
            width: min(100% - 36px, 440px);
            padding: 12px 18px 0;
            text-align: center;
            animation: rise-in 420ms ease-out both;
        }

        .brand-mark {
            width: 62px;
            height: 62px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(242, 122, 43, 0.55);
            border-radius: 16px 16px 6px 16px;
            background: rgba(255, 255, 255, 0.86);
            color: var(--orange);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 22px;
            font-weight: 700;
            box-shadow: 0 10px 18px var(--shadow);
        }

        h1 {
            margin: 0;
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(34px, 3.6vw, 54px);
            font-weight: 600;
            line-height: 1.12;
            letter-spacing: -0.04em;
        }

        p {
            min-height: 28px;
            margin: 12px 0 26px;
            color: var(--muted);
            font-size: 15px;
            font-style: italic;
            letter-spacing: 0.01em;
        }

        .progress {
            width: 180px;
            height: 5px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(39, 51, 71, 0.12);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .progress span {
            display: block;
            width: 36%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--orange), #f1b04e, var(--green));
            box-shadow: 0 0 10px rgba(242, 122, 43, 0.2);
            animation: loading 1.45s ease-in-out infinite;
        }

        .retry {
            margin-top: 24px;
            border: 0;
            background: transparent;
            color: var(--green);
            font: inherit;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .retry:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        @keyframes loading {
            0% { transform: translateX(-115%); }
            100% { transform: translateX(335%); }
        }

        @keyframes rise-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <main aria-live="polite">
        <div class="brand-mark" aria-hidden="true">CP</div>
        <h1>Cafeteria Pre-Order</h1>
        <p id="status">Getting the menu ready…</p>
        <div class="progress" role="progressbar" aria-label="Starting the app">
            <span></span>
        </div>
        <button class="retry" type="button" onclick="window.location.reload()">Try again</button>
    </main>
    <script>
        const statusText = document.getElementById('status');
        let delay = 800;
        let attempts = 0;

        async function waitForApp() {
            while (true) {
                attempts += 1;
                try {
                    const response = await fetch('/healthz', { cache: 'no-store' });
                    if (response.ok) {
                        window.location.replace('/menu');
                        return;
                    }
                } catch (error) {
                    // The function is still starting or is temporarily unreachable.
                }

                if (attempts === 5) {
                    statusText.textContent = 'This is taking a little longer than usual.';
                }
                await new Promise(resolve => setTimeout(resolve, delay));
                delay = Math.min(Math.round(delay * 1.5), 3000);
            }
        }

        waitForApp();
    </script>
</body>
</html>
